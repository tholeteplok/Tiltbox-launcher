name: Build Tiltbox Launcher APK

on:
  push:
    branches: [ main, development ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK with version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ github.ref_name }}"
          SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          DEST="app/build/outputs/apk/debug/Tiltbox-Launcher-${VERSION}.apk"
          cp "$SRC" "$DEST"
          echo "APK_PATH=$DEST" >> $GITHUB_ENV

      - name: Rename APK for branch builds (non-tag)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          DEST="app/build/outputs/apk/debug/Tiltbox-Launcher-debug-${SHA}.apk"
          cp "$SRC" "$DEST"
          echo "APK_PATH=$DEST" >> $GITHUB_ENV

      - name: Upload APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiltboxLauncher-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Extract Changelog for Release Notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md | head -30)
          else
            NOTES="Tiltbox Launcher ${VERSION} - Auto-generated release."
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          name: "Tiltbox Launcher ${{ github.ref_name }}"
          body: |
            ## Tiltbox Launcher ${{ github.ref_name }}

            ${{ steps.changelog.outputs.notes }}

            ---
            ### 📲 Cara Update via In-App Updater (Tiltbox TV)
            1. Buka launcher di Smart TV Anda.
            2. Launcher akan otomatis mendeteksi pembaruan ini dan menampilkan notifikasi.
            3. Tekan tombol **Unduh & Pasang** — launcher akan mengunduh APK dan membuka installer TV.

            ### 📦 Instalasi Manual (Sideload via ADB atau USB)
            ```bash
            # Melalui ADB (pastikan ADB debug aktif di TV)
            adb install Tiltbox-Launcher-${{ github.ref_name }}.apk
            ```
          generate_release_notes: false
          files: ${{ env.APK_PATH }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
