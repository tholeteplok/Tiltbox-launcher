<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playbox — Smart TV Launcher</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow:#f6c515;
    --teal-1:rgba(133,222,214,.75); --teal-2:rgba(38,128,132,.55); --teal-3:rgba(12,74,80,.70);
    --glass-1:rgba(255,255,255,.16); --glass-2:rgba(255,255,255,.04);
    --txt:#fff; --muted:rgba(255,255,255,.55);
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Manrope',system-ui,sans-serif;}
  html,body{height:100%;overflow:hidden;background:#07090a;}
  button{background:none;border:none;color:inherit;cursor:pointer;text-align:left;}

  /* ============ BACKGROUND ============ */
  .bg{position:fixed;inset:0;background:
      radial-gradient(500px 400px at 85% 55%, rgba(0,0,0,.55), transparent 70%),
      radial-gradient(900px 500px at 70% 15%, #17211f 0%, transparent 60%),
      linear-gradient(180deg,#0c1112,#080b0c 55%,#050708);}
  .collage{position:absolute;left:7%;top:9%;width:34%;height:48%;display:grid;
    grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;
    filter:blur(16px) saturate(.75);opacity:.45;transform:rotate(-2deg);}
  .collage div:nth-child(1){background:linear-gradient(140deg,#3a403d,#232827);}
  .collage div:nth-child(2){background:linear-gradient(140deg,#2c3230,#434a46);}
  .collage div:nth-child(3){background:linear-gradient(140deg,#242928,#313735);}
  .collage div:nth-child(4){background:linear-gradient(140deg,#3d4340,#202524);}
  .beam{position:absolute;height:170px;width:65%;filter:blur(26px);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.075),transparent);
    transform:rotate(-16deg);animation:drift 14s ease-in-out infinite alternate;}
  .beam.b1{top:5%;left:25%;} .beam.b2{top:24%;left:45%;opacity:.6;animation-delay:-6s;}
  @keyframes drift{from{transform:rotate(-16deg) translateX(-40px);}to{transform:rotate(-16deg) translateX(60px);}}
  .vignette{position:absolute;inset:0;background:radial-gradient(120% 95% at 50% 40%, transparent 42%, rgba(0,0,0,.6) 100%);}

  /* ============ HEADER ============ */
  header{position:absolute;top:0;left:0;right:0;z-index:6;padding:22px 50px 8px;
    display:flex !important;flex-direction:row !important;justify-content:space-between !important;align-items:flex-start !important;}
  
  .header-left{display:flex;flex-direction:column;gap:8px;align-items:flex-start;}

  /* Tiltbox rata kiri dengan text besar 2x (48px) */
  .logo{font-size:48px;font-weight:800;letter-spacing:-1.2px;line-height:1;color:var(--txt);user-select:none;text-align:left;}
  .logo span{color:var(--yellow);} 
  .logo sup{font-size:15px;color:var(--muted);vertical-align:super;margin-left:2px;}

  /* Search bar manual & voice input dibawahnya */
  .search-container{display:flex;align-items:center;gap:10px;margin-top:2px;}
  
  .search-bar{display:flex;align-items:center;gap:10px;width:320px;height:36px;padding:0 14px;
    border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(14px);color:#fff;cursor:pointer;
    transition:all .3s cubic-bezier(.22,1,.36,1);}
  .search-bar:hover, .search-bar.focus{border-color:var(--yellow);background:rgba(255,255,255,.14);
    box-shadow:0 0 0 2px rgba(246,197,21,.5), 0 8px 24px rgba(0,0,0,.4);transform:scale(1.02);}
  .search-bar svg{width:16px;height:16px;stroke:var(--muted);transition:.3s;flex-shrink:0;}
  .search-bar:hover svg, .search-bar.focus svg{stroke:var(--yellow);}
  .search-input{background:none;border:none;outline:none;color:#fff;font-size:11.5px;width:100%;font-weight:500;}
  .search-input::placeholder{color:var(--muted);opacity:.85;}

  .voice-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;cursor:pointer;
    backdrop-filter:blur(14px);transition:all .3s cubic-bezier(.22,1,.36,1);color:#fff;}
  .voice-btn:hover, .voice-btn.focus{background:var(--yellow);border-color:transparent;color:#151006;
    box-shadow:0 0 24px rgba(246,197,21,.65);transform:scale(1.08);}
  .voice-btn svg{width:17px;height:17px;}

  .header-right{display:flex;align-items:center;gap:12px;padding-top:4px;}
  .ctrl{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.09);
    background:rgba(255,255,255,.07);display:grid;place-items:center;transition:.3s;color:#fff;}
  .ctrl:hover, .ctrl.focus{background:rgba(255,255,255,.18);transform:scale(1.05);border-color:rgba(255,255,255,.3);}
  .ctrl svg{width:20px;height:20px;transition:.4s;}
  .ctrl.gear:hover svg, .ctrl.gear.focus svg{transform:rotate(60deg);}

  /* ============ LANES (3 BARIS) ============ */
  main{position:absolute;top:154px;bottom:64px;left:0;right:0;z-index:4;
    display:flex;flex-direction:column;gap:28px;
    overflow-y:auto;scroll-behavior:smooth;scrollbar-width:none;
    scroll-padding-top:60px;
    padding-bottom:32px;}
  main::-webkit-scrollbar{display:none;}
  .lane{display:flex;flex-direction:column;gap:12px;flex-shrink:0;}
  .lane-head{padding:0 50px;display:flex;align-items:baseline;gap:10px;}
  .lane-head h2{font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.85);}
  .lane-head h2::before{content:"";display:inline-block;width:14px;height:3px;border-radius:2px;
    background:var(--yellow);margin-right:8px;vertical-align:middle;}
  .lane-head em{font-style:normal;font-size:10px;color:var(--muted);letter-spacing:.06em;}
  
  /* Baris container dengan ruang lega ekstra agar kartu miring (-4°) tidak terpotong header */
  .row{display:flex;gap:20px;overflow-x:auto;padding:32px 50px 22px;width:100%;
    align-items:center;scroll-snap-type:x proximity;scrollbar-width:none;
    margin-top:-14px;margin-bottom:-6px;}
  .row::-webkit-scrollbar{display:none;}
  .item{position:relative;flex:0 0 auto;scroll-snap-align:center;scroll-margin-top:50px;
    transition:transform .4s cubic-bezier(.22,1,.36,1), background .4s, box-shadow .4s, border-color .4s;}
  .item:focus{outline:none;}
  .item.pulse{box-shadow:0 0 0 3px rgba(246,197,21,.9), 0 24px 60px rgba(0,0,0,.5) !important;}

  /* --- Baris 1 : Sumber / Input (KARTU BESAR 16:9 & TIDAK TERPOTONG SAAT MIRING) --- */
  .src{width:260px;height:142px;border-radius:18px;padding:16px 20px;color:var(--txt);
    display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;
    background:linear-gradient(150deg,var(--glass-1),var(--glass-2) 55%,rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.13);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:0 16px 36px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);}
  .src:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.25);}
  .src h3{font-size:18px;font-weight:700;}
  .src .count{font-size:12px;font-weight:600;opacity:.92;}
  .src .stat{margin-top:3px;font-size:9.5px;color:var(--muted);display:flex;align-items:center;gap:5px;}
  .dot{width:6px;height:6px;border-radius:50%;background:#42d77d;box-shadow:0 0 8px #42d77d;}
  .dot.off{background:rgba(255,255,255,.25);box-shadow:none;}
  .src-icon{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:58px;height:58px;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));}
  .src-icon svg{width:100%;height:100%;}
  .tab{position:absolute;top:-11px;left:50%;transform:translateX(-50%) scale(.5);width:76px;height:16px;
    border-radius:8px;background:var(--yellow);opacity:0;transition:.4s cubic-bezier(.22,1,.36,1);}
  .src.focus{transform:rotate(-4deg) translateY(-8px) scale(1.05);z-index:2;
    background:linear-gradient(155deg,var(--teal-1),var(--teal-2) 45%,var(--teal-3));
    border-color:rgba(255,255,255,.28);
    box-shadow:0 28px 64px rgba(0,0,0,.55), 0 0 44px rgba(64,190,185,.18), inset 0 1px 0 rgba(255,255,255,.3);}
  .src.focus .tab{opacity:1;transform:translateX(-50%) scale(1);
    box-shadow:0 0 28px rgba(246,197,21,.6);animation:glow 2.6s ease-in-out infinite;}
  @keyframes glow{0%,100%{box-shadow:0 0 18px rgba(246,197,21,.45);}50%{box-shadow:0 0 38px rgba(246,197,21,.85);}}

  /* --- Baris 2 : Aplikasi (KARTU BESAR SQUIRCLE) --- */
  .app{display:flex;flex-direction:column;align-items:center;gap:8px;width:96px;}
  .thumb{width:96px;height:96px;border-radius:24px;overflow:hidden;display:grid;place-items:center;
    border:1px solid rgba(255,255,255,.1);box-shadow:0 12px 28px rgba(0,0,0,.5);transition:inherit;}
  .thumb svg{width:100%;height:100%;display:block;}
  .app-name{font-size:11px;font-weight:600;color:var(--muted);transition:.3s;white-space:nowrap;}
  .app:hover .thumb{transform:translateY(-3px);}
  .app.focus{transform:translateY(-6px) scale(1.10);z-index:2;}
  .app.focus .thumb{box-shadow:0 0 0 3px var(--yellow), 0 0 36px rgba(246,197,21,.35), 0 20px 40px rgba(0,0,0,.6);}
  .app.focus .app-name{color:var(--yellow);}

  /* --- Baris 3 : Pengaturan cepat (LEGA DI BAWAH) --- */
  .set{display:flex;align-items:center;gap:12px;width:260px;padding:12px 15px;border-radius:16px;color:var(--txt);
    background:linear-gradient(150deg,rgba(255,255,255,.1),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);
    box-shadow:0 10px 24px rgba(0,0,0,.4);}
  .set:hover{transform:translateY(-2px);}
  .s-ico{width:36px;height:36px;flex:0 0 auto;border-radius:10px;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.08);display:grid;place-items:center;transition:.35s;}
  .s-ico svg{width:18px;height:18px;}
  .s-txt b{display:block;font-size:12px;font-weight:700;}
  .s-txt span{font-size:9.5px;color:var(--muted);}
  .set.focus{transform:scale(1.04);border-color:rgba(246,197,21,.65);z-index:2;
    background:linear-gradient(150deg,rgba(246,197,21,.16),rgba(255,255,255,.04));
    box-shadow:0 0 0 2px rgba(246,197,21,.55), 0 16px 36px rgba(0,0,0,.5);}
  .set.focus .s-ico{background:var(--yellow);color:#151006;border-color:transparent;}

  /* ============ FOOTER ============ */
  footer{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:12px 50px;
    display:flex;justify-content:space-between;align-items:center;color:var(--txt);
    background:linear-gradient(180deg,transparent,rgba(5,7,8,.85) 45%,#050708);}
  .shift{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;}
  .shift .ico{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);display:grid;place-items:center;}
  .shift .ico svg{width:16px;height:16px;}
  .status{display:flex;align-items:center;gap:14px;}
  .time{font-size:18px;font-weight:800;letter-spacing:.5px;}
  .time small{font-size:10px;font-weight:600;opacity:.6;margin-left:3px;}
  .divider{width:1px;height:30px;background:rgba(255,255,255,.16);}
  .place b{display:block;font-size:13.5px;font-weight:700;}
  .place span{font-size:9.5px;color:var(--muted);}
  .weather{display:flex;align-items:center;gap:8px;}
  .weather svg{width:32px;height:32px;}
  .temp{font-size:13px;font-weight:600;opacity:.85;}

  /* ============ TOAST & HINT ============ */
  .toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,16px);z-index:9;
    display:flex;align-items:center;gap:10px;padding:11px 20px;border-radius:999px;
    background:rgba(20,26,27,.85);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(14px);
    font-size:12.5px;font-weight:600;color:#fff;opacity:0;pointer-events:none;transition:.35s;}
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .t-dot{width:8px;height:8px;border-radius:50%;background:var(--yellow);box-shadow:0 0 10px var(--yellow);}
  .hint{display:none;}
</style>
</head>
<body>

<div class="bg">
  <div class="collage"><div></div><div></div><div></div><div></div></div>
  <div class="beam b1"></div><div class="beam b2"></div><div class="vignette"></div>
</div>

<header>
  <div class="header-left">
    <div class="logo">tilt<span>box</span><sup>™</sup></div>
    <div class="search-container">
      <div class="search-bar item" tabindex="0" data-name="Pencarian" data-action="search" onclick="document.getElementById('manualSearchInput').focus();">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" class="search-input" id="manualSearchInput" placeholder="Cari film, acara TV, aplikasi…" onkeydown="if(event.key==='Enter'&&window.TiltboxBridge){window.TiltboxBridge.launchSearch(this.value);event.stopPropagation();}" />
      </div>
      <button class="voice-btn item" tabindex="0" title="Voice Search" data-name="Pencarian Suara" data-action="voice" onclick="if(window.TiltboxBridge) window.TiltboxBridge.launchVoiceSearch();">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="header-right">
    <button class="ctrl gear item" tabindex="0" title="Settings" data-name="Pengaturan TV" data-action="settings" onclick="if(window.TiltboxBridge) window.TiltboxBridge.launchSettings();">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<main>
  <!-- ===== BARIS 1 : SUMBER & INPUT ===== -->
  <section class="lane">
    <div class="lane-head"><h2>Sumber &amp; Input</h2><em>Live TV, Media, HDMI</em></div>
    <div class="row">
      <button class="item src" data-name="Live TV's" data-action="livetv">
        <span class="tab"></span><h3>Live TV's</h3>
        <div class="src-icon"><svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="20" width="50" height="36" rx="9"/><path d="M24 20 18 9M40 20 46 9"/><polyline points="22,40 29,33 35,41 43,31" stroke="#f6c515"/></svg></div>
        <div><p class="count">+48 Saluran</p><p class="stat"><span class="dot"></span>Siaran TV Digital</p></div>
      </button>
      <button class="item src" data-name="Media Player" data-action="media">
        <span class="tab"></span><h3>Media</h3>
        <div class="src-icon"><svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20a6 6 0 0 1 6-6h10l6 6h18a6 6 0 0 1 6 6v20a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6z"/><path d="M28 30l12 7-12 7z" stroke="#f6c515"/></svg></div>
        <div><p class="count">USB &amp; File Lokal</p><p class="stat"><span class="dot"></span>Penyimpanan lokal</p></div>
      </button>
      <button class="item src" data-name="HDMI 1" data-action="hdmi" data-port="HDMI1">
        <span class="tab"></span><h3>HDMI 1</h3>
        <div class="src-icon"><svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 22h44v12l-6 6H16l-6-6z"/><path d="M20 28v6M28 28v6M36 28v6M44 28v6" stroke="#f6c515"/><path d="M32 40v10"/></svg></div>
        <div><p class="count">Input HDMI 1</p><p class="stat"><span class="dot"></span>Terhubung</p></div>
      </button>
      <button class="item src" data-name="HDMI 2" data-action="hdmi" data-port="HDMI2">
        <span class="tab"></span><h3>HDMI 2</h3>
        <div class="src-icon"><svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 22h44v12l-6 6H16l-6-6z"/><path d="M20 28v6M28 28v6M36 28v6M44 28v6" stroke="#f6c515"/><path d="M32 40v10"/></svg></div>
        <div><p class="count">Input HDMI 2</p><p class="stat"><span class="dot off"></span>Standby</p></div>
      </button>
      <button class="item src" data-name="Screen Cast" data-action="cast">
        <span class="tab"></span><h3>Cast</h3>
        <div class="src-icon"><svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="14" width="48" height="34" rx="6"/><path d="M14 42a10 10 0 0 1 10 10M14 34a18 18 0 0 1 18 18" stroke="#f6c515"/><circle cx="15" cy="47" r="2.5" fill="#f6c515" stroke="none"/></svg></div>
        <div><p class="count">Google Cast</p><p class="stat"><span class="dot"></span>Siap menerima</p></div>
      </button>
    </div>
  </section>

  <!-- ===== BARIS 2 : APLIKASI TERPASANG (MAX 9 + SEMUA APLIKASI 9-DOT GRID) ===== -->
  <section class="lane" id="appsLane">
    <div class="lane-head"><h2>Aplikasi Terpasang</h2><em>Streaming &amp; Hiburan</em></div>
    <div class="row" id="appsRow">
      <button class="item app" data-name="YouTube" data-action="app" data-pkg="com.google.android.youtube.tv">
        <span class="thumb"><svg viewBox="0 0 48 48"><rect width="48" height="48" fill="#f00"/><path d="M19 15v18l16-9z" fill="#fff"/></svg></span>
        <span class="app-name">YouTube</span>
      </button>
      <button class="item app" data-name="Spotify" data-action="app" data-pkg="com.spotify.tv.android">
        <span class="thumb"><svg viewBox="0 0 48 48"><rect width="48" height="48" fill="#1db954"/><g fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"><path d="M13 18c8-2.2 16-1.6 22 1.4"/><path d="M14.5 24.5c6.6-1.8 12.6-1.3 17.6 1.1"/><path d="M16 30.5c5-1.3 9.4-.9 13.2 1"/></g></svg></span>
        <span class="app-name">Spotify</span>
      </button>
      <button class="item app" data-name="Vision+" data-action="app" data-pkg="id.visionplus.android.atv">
        <span class="thumb"><svg viewBox="0 0 48 48"><rect width="48" height="48" fill="#002b49"/><text x="24" y="32" text-anchor="middle" font-family="Manrope,sans-serif" font-size="20" font-weight="900" fill="#00d6ff">V+</text></svg></span>
        <span class="app-name">Vision+</span>
      </button>
      <button class="item app" data-name="MX Player" data-action="app" data-pkg="com.mxtech.videoplayer.ad">
        <span class="thumb"><svg viewBox="0 0 48 48"><rect width="48" height="48" fill="#0078d7"/><text x="24" y="30" text-anchor="middle" font-family="Manrope,sans-serif" font-size="16" font-weight="800" fill="#fff">MX</text></svg></span>
        <span class="app-name">MX Player</span>
      </button>
      <button class="item app" data-name="X-plore" data-action="app" data-pkg="com.lonelycatgames.Xplore">
        <span class="thumb"><svg viewBox="0 0 48 48"><rect width="48" height="48" fill="#f59e0b"/><path d="M12 16h8l4 4h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V18a2 2 0 0 1 2-2z" fill="#fff"/></svg></span>
        <span class="app-name">X-plore</span>
      </button>
      <button class="item app" data-name="Play Store" data-action="app" data-pkg="com.android.vending">
        <span class="thumb"><svg viewBox="0 0 48 48"><rect width="48" height="48" fill="#141a21"/><path d="M13 11v26l14-13z" fill="#00d6ff"/><path d="M27 24L33.5 30.2 13 11z" fill="#00f076"/><path d="M27 24l4.2-2.7 5.2 3c1 .6 1 1.7 0 2.2l-5.2 3.1L27 24z" fill="#ffc107"/><path d="M13 37l14-13 6.5 6.2L14.8 38.6c-.9.5-1.8.1-1.8-1.6z" fill="#ff3d00"/></svg></span>
        <span class="app-name">Play Store</span>
      </button>
      <button class="item app" data-name="Semua Aplikasi" data-action="apps">
        <span class="thumb" style="border-color:rgba(246,197,21,.35);background:rgba(255,255,255,.05);">
          <svg viewBox="0 0 48 48">
            <rect width="48" height="48" rx="14" fill="rgba(255,255,255,.06)"/>
            <g fill="#f6c515">
              <circle cx="16" cy="16" r="3.2"/>
              <circle cx="24" cy="16" r="3.2"/>
              <circle cx="32" cy="16" r="3.2"/>
              <circle cx="16" cy="24" r="3.2"/>
              <circle cx="24" cy="24" r="3.2"/>
              <circle cx="32" cy="24" r="3.2"/>
              <circle cx="16" cy="32" r="3.2"/>
              <circle cx="24" cy="32" r="3.2"/>
              <circle cx="32" cy="32" r="3.2"/>
            </g>
          </svg>
        </span>
        <span class="app-name" style="color:var(--yellow);font-weight:700;">Semua Aplikasi</span>
      </button>
    </div>
  </section>

  <!-- ===== BARIS 3 : PENGATURAN CEPAT ===== -->
  <section class="lane">
    <div class="lane-head"><h2>Pengaturan Cepat</h2><em>Setelan &amp; Utilitas TV</em></div>
    <div class="row">
      <button class="item set" data-name="RAM Booster" data-action="boost">
        <span class="s-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></span>
        <span class="s-txt"><b>RAM Booster</b><span>Percepat TV &amp; bersihkan memori</span></span>
      </button>
      <button class="item set" data-name="Pengaturan TV" data-action="settings">
        <span class="s-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
        <span class="s-txt"><b>Pengaturan TV</b><span>Setelan sistem Android</span></span>
      </button>
      <button class="item set" data-name="Jaringan & Wi-Fi" data-action="wifi">
        <span class="s-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg></span>
        <span class="s-txt"><b>Jaringan &amp; Wi-Fi</b><span>Koneksi internet &amp; Wi-Fi</span></span>
      </button>
      <button class="item set" data-name="Kelola Aplikasi" data-action="apps">
        <span class="s-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></span>
        <span class="s-txt"><b>Kelola Aplikasi</b><span>Daftar aplikasi terpasang</span></span>
      </button>
      <button class="item set" data-name="Gambar & Suara TCL" data-action="tcl_settings">
        <span class="s-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></span>
        <span class="s-txt"><b>Gambar &amp; Suara TCL</b><span>Preset TV</span></span>
      </button>
    </div>
  </section>
</main>

<p class="hint" id="hint">↑ ↓ ← → navigasi &nbsp;•&nbsp; Enter pilih</p>

<footer>
  <div class="shift" onclick="boostRamAction();" style="cursor:pointer;" title="Percepat TV &amp; bersihkan memori">
    <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></span>
    <span>RAM Booster: <b id="ramBoosterText" style="color:var(--yellow);font-weight:700;">450 MB Bebas</b></span>
  </div>
  <div class="status">
    <div class="time" id="clock">12:51 <small>am</small></div>
    <div class="divider"></div>
    <div class="place"><b>Indonesia</b><span>Zona WIB</span></div>
    <div class="weather" id="weatherWidget">
      <svg id="weatherIcon" viewBox="0 0 64 64"><circle cx="24" cy="18" r="9" fill="#f6c515"/><path transform="translate(8,10) scale(2.2)" d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" fill="#fff" opacity=".92"/></svg>
      <span class="temp" id="weatherTemp">28°</span>
    </div>
  </div>
</footer>

<div class="toast" id="toast"><span class="t-dot"></span><span id="toastMsg"></span></div>

<script>
  const KNOWN_APP_ICONS = {
    'com.google.android.youtube.tv': '<rect width="48" height="48" fill="#f00"/><path d="M19 15v18l16-9z" fill="#fff"/>',
    'com.spotify.tv.android': '<rect width="48" height="48" fill="#1db954"/><g fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"><path d="M13 18c8-2.2 16-1.6 22 1.4"/><path d="M14.5 24.5c6.6-1.8 12.6-1.3 17.6 1.1"/><path d="M16 30.5c5-1.3 9.4-.9 13.2 1"/></g>',
    'id.visionplus.android.atv': '<rect width="48" height="48" fill="#002b49"/><text x="24" y="32" text-anchor="middle" font-family="Manrope,sans-serif" font-size="20" font-weight="900" fill="#00d6ff">V+</text>',
    'com.mxtech.videoplayer.ad': '<rect width="48" height="48" fill="#0078d7"/><text x="24" y="30" text-anchor="middle" font-family="Manrope,sans-serif" font-size="16" font-weight="800" fill="#fff">MX</text>',
    'com.lonelycatgames.Xplore': '<rect width="48" height="48" fill="#f59e0b"/><path d="M12 16h8l4 4h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V18a2 2 0 0 1 2-2z" fill="#fff"/>',
    'com.android.vending': '<rect width="48" height="48" fill="#141a21"/><path d="M13 11v26l14-13z" fill="#00d6ff"/><path d="M27 24L33.5 30.2 13 11z" fill="#00f076"/><path d="M27 24l4.2-2.7 5.2 3c1 .6 1 1.7 0 2.2l-5.2 3.1L27 24z" fill="#ffc107"/><path d="M13 37l14-13 6.5 6.2L14.8 38.6c-.9.5-1.8.1-1.8-1.6z" fill="#ff3d00"/>',
    'com.netflix.ninja': '<rect width="48" height="48" fill="#0b0b0b"/><text x="24" y="34" text-anchor="middle" font-family="Manrope,sans-serif" font-size="27" font-weight="800" fill="#e50914">N</text>',
    'com.kmk.video.tcl': '<rect width="48" height="48" fill="#e52d27"/><path d="M17 14l16 10-16 10V14z" fill="#fff"/>',
    'com.android.gallery3d': '<rect width="48" height="48" fill="#0284c7"/><circle cx="20" cy="18" r="5" fill="#f6c515"/><polygon points="10,38 22,24 32,34 38,28 44,38" fill="#fff"/>'
  };

  const ALL_APPS_GRID_SVG = `
    <rect width="48" height="48" rx="14" fill="rgba(255,255,255,.06)"/>
    <g fill="#f6c515">
      <circle cx="16" cy="16" r="3.2"/>
      <circle cx="24" cy="16" r="3.2"/>
      <circle cx="32" cy="16" r="3.2"/>
      <circle cx="16" cy="24" r="3.2"/>
      <circle cx="24" cy="24" r="3.2"/>
      <circle cx="32" cy="24" r="3.2"/>
      <circle cx="16" cy="32" r="3.2"/>
      <circle cx="24" cy="32" r="3.2"/>
      <circle cx="32" cy="32" r="3.2"/>
    </g>
  `;

  /* ===== Navigasi 2D ala remote TV ===== */
  let lanes = [];
  let cols = [];
  let r = 1, toastTimer; // default pada Baris 1 (Live TV's)
  const mainEl = document.querySelector('main');

  function rebindNav() {
    const headerItems = [...document.querySelectorAll('header .item')];
    const laneRows = [...document.querySelectorAll('main .lane')].map(l => [...l.querySelectorAll('.item')]);
    lanes = [headerItems, ...laneRows];
    cols = lanes.map(() => 0);

    lanes.forEach((lane, rI) => lane.forEach((el, cI) => {
      el.onclick = () => { focusItem(rI, cI); select(el); };
      el.onmouseenter = () => focusItem(rI, cI, false);
    }));

    focusItem(1, 0, false);
  }

  function focusItem(rI, cI, scroll = true){
    r = Math.max(0, Math.min(lanes.length - 1, rI));
    const lane = lanes[r];
    const c = Math.max(0, Math.min(lane.length - 1, cI));
    cols[r] = c;
    document.querySelectorAll('.item.focus').forEach(el => el.classList.remove('focus'));
    const el = lane[c];
    if (el) el.classList.add('focus');

    if (scroll && el) {
      if (r <= 1) {
        // Reset penuh ke scrollTop 0 agar kartu Sumber & Input tidak pernah terpotong header
        if (mainEl) mainEl.scrollTo({ top: 0, behavior: 'smooth' });
        el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      } else if (r === 2) {
        el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      } else if (r >= 3) {
        if (mainEl) mainEl.scrollTo({ top: mainEl.scrollHeight, behavior: 'smooth' });
        el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
    }
  }

  /* ===== Render Aplikasi Terpasang Dinamis (Maks 9 + Semua Aplikasi Grid) ===== */
  function renderInstalledApps() {
    let appList = [];
    if (window.TiltboxBridge && window.TiltboxBridge.getInstalledApps) {
      try {
        const raw = window.TiltboxBridge.getInstalledApps();
        if (raw) appList = JSON.parse(raw);
      } catch(e) {
        console.error("Error parsing apps", e);
      }
    }

    if (!appList || appList.length === 0) {
      appList = [
        { packageName: 'com.google.android.youtube.tv', name: 'YouTube' },
        { packageName: 'com.spotify.tv.android', name: 'Spotify' },
        { packageName: 'id.visionplus.android.atv', name: 'Vision+' },
        { packageName: 'com.mxtech.videoplayer.ad', name: 'MX Player' },
        { packageName: 'com.lonelycatgames.Xplore', name: 'X-plore' },
        { packageName: 'com.android.vending', name: 'Play Store' }
      ];
    }

    // Maksimal 9 aplikasi terlihat
    const maxVisibleApps = appList.slice(0, 9);
    const rowEl = document.getElementById('appsRow');
    if (!rowEl) return;

    let html = '';
    maxVisibleApps.forEach(app => {
      let iconSvg = KNOWN_APP_ICONS[app.packageName];
      let innerContent = '';
      if (iconSvg) {
        innerContent = `<svg viewBox="0 0 48 48">${iconSvg}</svg>`;
      } else if (app.icon && app.icon.startsWith('data:image')) {
        innerContent = `<img src="${app.icon}" style="width:100%;height:100%;object-fit:cover;border-radius:24px;" />`;
      } else {
        const initial = (app.name || 'A').charAt(0).toUpperCase();
        innerContent = `<svg viewBox="0 0 48 48"><rect width="48" height="48" fill="#1e293b"/><text x="24" y="32" text-anchor="middle" font-family="Manrope,sans-serif" font-size="20" font-weight="800" fill="#f6c515">${initial}</text></svg>`;
      }

      html += `
        <button class="item app" data-name="${app.name}" data-action="app" data-pkg="${app.packageName}">
          <span class="thumb">${innerContent}</span>
          <span class="app-name">${app.name}</span>
        </button>
      `;
    });

    // 1 tombol "Semua Aplikasi" di ujung dengan ikon 9-dot grid
    html += `
      <button class="item app" data-name="Semua Aplikasi" data-action="apps">
        <span class="thumb" style="border-color:rgba(246,197,21,.35);background:rgba(255,255,255,.05);">
          <svg viewBox="0 0 48 48">${ALL_APPS_GRID_SVG}</svg>
        </span>
        <span class="app-name" style="color:var(--yellow);font-weight:700;">Semua Aplikasi</span>
      </button>
    `;

    rowEl.innerHTML = html;
    rebindNav();
  }

  function select(el){
    el.classList.add('pulse');
    setTimeout(() => el.classList.remove('pulse'), 380);
    const toast = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = `Membuka ${el.dataset.name}…`;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);

    // Native Android TV Bridge Execution
    if (window.TiltboxBridge) {
      const action = el.dataset.action;
      const pkg = el.dataset.pkg;
      const port = el.dataset.port || el.dataset.name;
      if (action === 'search') {
        const inp = document.getElementById('manualSearchInput');
        if (inp) inp.focus();
        if (window.TiltboxBridge) window.TiltboxBridge.launchSearch(inp ? inp.value : "");
      } else if (action === 'voice') {
        if (window.TiltboxBridge) window.TiltboxBridge.launchVoiceSearch();
      } else if (action === 'livetv') {
        window.TiltboxBridge.launchLiveTv();
      } else if (action === 'media') {
        window.TiltboxBridge.launchMedia();
      } else if (action === 'hdmi') {
        window.TiltboxBridge.launchHdmi(port);
      } else if (action === 'cast') {
        window.TiltboxBridge.launchApp('com.google.android.apps.mediashell');
      } else if (action === 'app' && pkg) {
        window.TiltboxBridge.launchApp(pkg);
      } else if (action === 'settings') {
        window.TiltboxBridge.launchSettings();
      } else if (action === 'wifi') {
        window.TiltboxBridge.launchWifiSettings();
      } else if (action === 'apps') {
        window.TiltboxBridge.launchAppsSettings();
      } else if (action === 'tcl_settings') {
        window.TiltboxBridge.launchTclPictureAudioSettings();
      } else if (action === 'boost') {
        boostRamAction();
      }
    }
  }

  function boostRamAction() {
    if (window.TiltboxBridge) {
      window.TiltboxBridge.boostRam();
      setTimeout(updateRamStatus, 1200);
    }
  }

  /* ===== RAM Booster Dinamis Realtime ===== */
  function updateRamStatus() {
    if (window.TiltboxBridge && window.TiltboxBridge.getAvailableRam) {
      const ramText = window.TiltboxBridge.getAvailableRam();
      const el = document.getElementById('ramBoosterText');
      if (el && ramText) el.textContent = ramText;
    }
  }
  setInterval(updateRamStatus, 4000);
  setTimeout(updateRamStatus, 800);

  /* ===== Cuaca Dinamis Berfungsi Nyata ===== */
  async function updateRealWeather() {
    try {
      const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-6.2088&longitude=106.8456&current_weather=true');
      if (res.ok) {
        const data = await res.json();
        const cur = data.current_weather;
        if (cur && typeof cur.temperature === 'number') {
          const tempC = Math.round(cur.temperature);
          const tEl = document.getElementById('weatherTemp');
          if (tEl) tEl.textContent = `${tempC}°`;
          
          const code = cur.weathercode;
          const wIcon = document.getElementById('weatherIcon');
          if (wIcon) {
            if (code === 0) {
              wIcon.innerHTML = `<circle cx="32" cy="32" r="14" fill="#f6c515"/>`;
            } else if (code >= 1 && code <= 3) {
              wIcon.innerHTML = `<circle cx="24" cy="20" r="9" fill="#f6c515"/><path transform="translate(8,12) scale(2)" d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" fill="#fff" opacity=".92"/>`;
            } else if (code >= 51 && code <= 67 || code >= 80 && code <= 82) {
              wIcon.innerHTML = `<path transform="translate(8,8) scale(1.8)" d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" fill="#a0c4ff"/><line x1="20" y1="46" x2="16" y2="56" stroke="#4dabf7" stroke-width="3"/><line x1="32" y1="46" x2="28" y2="56" stroke="#4dabf7" stroke-width="3"/>`;
            }
          }
        }
      }
    } catch(e) {
      console.log('Cuaca offline', e);
    }
  }
  updateRealWeather();
  setInterval(updateRealWeather, 1800000); // refresh tiap 30 menit

  window.handleDpad = function(dir) {
    if (dir === 'right') focusItem(r, cols[r] + 1);
    else if (dir === 'left') focusItem(r, cols[r] - 1);
    else if (dir === 'down') focusItem(r + 1, cols[r + 1] ?? 0);
    else if (dir === 'up') focusItem(r - 1, cols[r - 1] ?? 0);
    else if (dir === 'enter') select(lanes[r][cols[r]]);
  };

  document.addEventListener('keydown', e => {
    if(e.key === 'ArrowRight'){ focusItem(r, cols[r] + 1); e.preventDefault(); }
    else if(e.key === 'ArrowLeft'){ focusItem(r, cols[r] - 1); e.preventDefault(); }
    else if(e.key === 'ArrowDown'){ focusItem(r + 1, cols[r + 1] ?? 0); e.preventDefault(); }
    else if(e.key === 'ArrowUp'){ focusItem(r - 1, cols[r - 1] ?? 0); e.preventDefault(); }
    else if(e.key === 'Enter' || e.key === ' '){ select(lanes[r][cols[r]]); e.preventDefault(); }
  });

  rebindNav();
  renderInstalledApps();

  /* ===== Jam real-time ===== */
  function tick(){
    const d = new Date(); let h = d.getHours();
    const ap = h < 12 ? 'am' : 'pm'; h = h % 12 || 12;
    document.getElementById('clock').innerHTML =
      `${h}:${String(d.getMinutes()).padStart(2,'0')} <small>${ap}</small>`;
  }
  tick(); setInterval(tick, 1000);
  setTimeout(() => document.getElementById('hint').classList.add('hide'), 6000);
</script>
</body>
</html>
