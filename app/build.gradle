plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tiltbox.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.tiltbox.launcher"
        minSdk 21
        targetSdk 34
        versionCode 15
        versionName "1.9.0"

        setProperty("archivesBaseName", "TiltboxLauncher_v" + versionName)
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // FileProvider untuk In-App Updater (android.support.FILE_PROVIDER_PATHS)
    implementation 'androidx.core:core-ktx:1.12.0'
}
